<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <defs>
    <linearGradient id="base" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#2b3240"/>
      <stop offset="50%" stop-color="#1a202b"/>
      <stop offset="100%" stop-color="#0d1118"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.3" cy="0.25" r="0.6">
      <stop offset="0%" stop-color="#8fa3bf" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#8fa3bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1920" height="1200" fill="url(#base)"/>
  <g filter="url(#soft)">
    <ellipse cx="580" cy="300" rx="700" ry="500" fill="url(#halo)"/>
    <ellipse cx="1500" cy="950" rx="600" ry="420" fill="#54627a" opacity="0.18"/>
  </g>
  <rect width="1920" height="1200" filter="url(#grain)" opacity="0.16"/>
</svg>
